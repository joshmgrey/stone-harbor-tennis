name: deploy

# Path B / B2 — deploy the Fargate app on merge to main.
#   1. prisma migrate deploy  (DB is still public in B2/B3; B4 moves this
#      into an in-VPC ECS task)
#   2. cdk deploy AppStack     (builds the Docker image asset, updates ECS)
#
# Auth is GitHub OIDC into the role from GitHubDeployStack — no stored keys.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "package*.json"
      - "next.config.ts"
      - "prisma/**"
      - "src/**"
      - "public/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write # OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    # Skip cleanly until B2 config is in place (see infra/README.md).
    if: vars.APP_DOMAIN != ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix infra ci

      - name: Run database migrations
        run: |
          DATABASE_URL="$(aws secretsmanager get-secret-value \
            --secret-id '${{ vars.DATABASE_URL_SECRET_ARN }}' \
            --query SecretString --output text)"
          export DATABASE_URL
          npx prisma migrate deploy

      - name: Deploy AppStack
        working-directory: infra
        run: |
          npx cdk deploy AppStack --require-approval never \
            -c env:account='${{ vars.AWS_ACCOUNT_ID }}' \
            -c env:region=us-east-2 \
            -c app:domainName='${{ vars.APP_DOMAIN }}' \
            -c app:hostedZoneId='${{ vars.HOSTED_ZONE_ID }}' \
            -c app:zoneName='${{ vars.ZONE_NAME }}' \
            -c app:googleMapsApiKey='${{ secrets.GOOGLE_MAPS_API_KEY }}' \
            -c app:databaseUrlSecretArn='${{ vars.DATABASE_URL_SECRET_ARN }}' \
            -c app:authSecretArn='${{ vars.AUTH_SECRET_ARN }}'
