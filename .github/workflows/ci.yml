name: ci

# Feedback on every PR (and on main after merge): typecheck, lint, the app's
# Vitest unit suite, the CDK assertion tests for infra/, and a Playwright E2E
# run against a real Postgres. No AWS — the container image and its smoke test
# live in docker-build.yml, deployment in deploy.yml.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [typecheck, lint, test]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The Prisma client is generated into node_modules; typecheck and the
      # route tests need its types.
      - run: npx prisma generate

      - run: npm run ${{ matrix.task }}

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - run: npm ci
        working-directory: infra

      # CDK assertion tests: synth each stack and assert on the CloudFormation
      # template. No AWS credentials — VPC lookups resolve to a dummy VPC and
      # the Docker image asset is only fingerprinted, not built.
      - run: npm test
        working-directory: infra

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tennis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # sslmode=disable: `next start` runs production mode, where
      # src/lib/prisma.ts enforces TLS unless the URL opts out; the service
      # container has no SSL.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tennis?sslmode=disable
      # The app's least-privilege role; created by the sync step below.
      APP_DATABASE_URL: postgresql://tennis_app:e2e-app-role-password@localhost:5432/tennis?sslmode=disable
      AUTH_SECRET: e2e-admin-secret
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Apply the committed migrations to the fresh service-container DB, then
      # build. Playwright's webServer runs `npm run start` against it (see
      # playwright.config.ts).
      # Migrate + create the least-privilege app role exactly as the prod
      # migrator does: no DATABASE_URL, owner creds from the RDS-secret-shaped
      # JSON (twice: the second run exercises the refresh path). Then prove the
      # role can't do DDL and run the e2e app server as it — so a missing
      # grant fails here rather than 500ing in production.
      #
      # The owner mimics the RDS master user: NOT a superuser (RDS gives it
      # rds_superuser), just CREATEROLE + CREATEDB and ownership of the DB.
      # The container's `postgres` is a real superuser and would hide
      # statements RDS rejects (e.g. ALTER ROLE ... NOSUPERUSER).
      - name: Create an RDS-like owner role
        run: |
          node --input-type=module -e '
            import pg from "pg";
            const c = new pg.Client({ connectionString: process.env.DATABASE_URL });
            await c.connect();
            await c.query("CREATE ROLE rds_master WITH LOGIN CREATEROLE CREATEDB NOSUPERUSER PASSWORD $$rds_master_pw$$");
            await c.query("ALTER DATABASE tennis OWNER TO rds_master");
            await c.end();
          '

      - name: Migrate and sync the app DB role (prod entry point)
        env:
          DATABASE_URL: ""
          DB_MASTER_SECRET: '{"username":"rds_master","password":"rds_master_pw","host":"localhost","port":5432,"dbname":"tennis","engine":"postgres"}'
        run: |
          node scripts/migrate.mjs
          node scripts/migrate.mjs
          node --input-type=module -e '
            import pg from "pg";
            const c = new pg.Client({ connectionString: process.env.APP_DATABASE_URL });
            await c.connect();
            await c.query("SELECT count(*) FROM sessions");
            for (const sql of ["DROP TABLE sessions", "SELECT * FROM _prisma_migrations"]) {
              try { await c.query(sql); console.error("app role was allowed: " + sql); process.exit(1); }
              catch (e) { if (e.code !== "42501") throw e; console.log("denied as expected: " + sql); }
            }
            await c.end();
          '

      - run: npm run build

      - run: npx playwright install --with-deps chromium

      - run: npm run e2e
        env:
          DATABASE_URL: ${{ env.APP_DATABASE_URL }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14
