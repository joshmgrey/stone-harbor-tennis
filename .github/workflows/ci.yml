name: ci

# Feedback on every PR (and on main after merge): typecheck, lint, the app's
# Vitest unit suite, the CDK assertion tests for infra/, and a Playwright E2E
# run against a real Postgres. No AWS — the container image and its smoke test
# live in docker-build.yml, deployment in deploy.yml.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [typecheck, lint, test]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The Prisma client is generated into node_modules; typecheck and the
      # route tests need its types.
      - run: npx prisma generate

      - run: npm run ${{ matrix.task }}

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - run: npm ci
        working-directory: infra

      # CDK assertion tests: synth each stack and assert on the CloudFormation
      # template. No AWS credentials — VPC lookups resolve to a dummy VPC and
      # the Docker image asset is only fingerprinted, not built.
      - run: npm test
        working-directory: infra

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tennis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # sslmode=disable: `next start` runs production mode, where
      # src/lib/prisma.ts enforces TLS unless the URL opts out; the service
      # container has no SSL.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tennis?sslmode=disable
      AUTH_SECRET: e2e-admin-secret
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Apply the committed migrations to the fresh service-container DB, then
      # build. Playwright's webServer runs `npm run start` against it (see
      # playwright.config.ts).
      - run: npx prisma migrate deploy
      - run: npm run build

      - run: npx playwright install --with-deps chromium

      - run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14
