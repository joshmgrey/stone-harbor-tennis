name: migrate

# Path B / B4 — `prisma migrate deploy` against the (now private) RDS
# instance, as a one-off Fargate task inside the VPC.
#
# deploy.yml already runs this before every app rollout, so you normally
# don't need it. It's for re-running a migration by hand (e.g. after fixing
# a failed one) or the first migration of a brand-new environment. It runs
# the migrator task definition from the last deploy of MigratorStack.

on:
  workflow_dispatch:

concurrency:
  group: migrate
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    if: vars.APP_DATABASE_URL_SECRET_ARN != ''
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Run the migrator task
        # Same script deploy.yml runs before rolling AppStack. Uses the
        # migrator task definition MigratorStack currently has (i.e. from the
        # last deploy).
        run: bash .github/scripts/run-migrator.sh
