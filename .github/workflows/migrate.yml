name: migrate

# Path B / B4 — `prisma migrate deploy` against the (now private) RDS
# instance, as a one-off Fargate task inside the VPC. Run this by hand
# (Actions -> migrate -> Run workflow) after merging a change that adds a
# migration, BEFORE it matters — schema changes are rare and deliberate.
#
# The task definition + network details come from AppStack, so deploy.yml
# must have run for this commit first.

on:
  workflow_dispatch:

concurrency:
  group: migrate
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    if: vars.DATABASE_URL_SECRET_ARN != ''
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Run the migrator task
        run: |
          set -euo pipefail

          out=$(aws cloudformation describe-stacks --stack-name AppStack \
            --query 'Stacks[0].Outputs' --output json)
          get() { echo "$out" | jq -r --arg k "$1" '.[]|select(.OutputKey==$k).OutputValue'; }
          CLUSTER=$(get ClusterName)
          TASKDEF=$(get MigratorTaskDefinitionArn)
          SUBNETS=$(get TaskSubnetIds)
          SG=$(get ServiceSecurityGroupId)

          echo "cluster=$CLUSTER  taskdef=$TASKDEF"

          arn=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASKDEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=ENABLED}" \
            --started-by "gha-migrate" \
            --query 'tasks[0].taskArn' --output text)
          echo "task: $arn"

          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$arn"

          read -r code reason < <(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$arn" \
            --query 'tasks[0].containers[0].[exitCode,reason]' --output text)
          echo "exit code: $code  reason: $reason"

          if [ "$code" != "0" ]; then
            echo "::error::migration task failed"
            aws logs tail "$(aws cloudformation describe-stack-resources --stack-name AppStack \
              --query "StackResources[?ResourceType=='AWS::Logs::LogGroup'].PhysicalResourceId" \
              --output text)" --since 15m --format short || true
            exit 1
          fi
